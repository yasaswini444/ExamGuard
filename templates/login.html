<!DOCTYPE html>
<html>

<head>

    <title>ExamGuard - Candidate Login</title>

    <!-- Login CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>


<body>


<div class="login-container">


    <!-- LOGO / PROJECT NAME -->

    <div class="brand">
        <h1>ExamGuard</h1>

        <p>Secure Examination Portal</p>
    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

        <h2>Candidate Login</h2>

        <p class="subtitle">
            Login to access your examination dashboard
        </p>


        <form method="POST">


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit">
                Login
            </button>


        </form>


        <!-- REGISTRATION LINK -->

        <p class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register here
            </a>

        </p>


    </div>


</div>


</body>

</html>
