<!DOCTYPE html>
<html>

<head>

    <title>ExamGuard - Candidate Registration</title>

    <!-- External CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

</head>


<body>


<div class="form-container">


    <!-- PAGE HEADING -->

    <h2>Candidate Registration</h2>

    <p class="subtitle">
        Register securely with your candidate details
    </p>


    <form method="POST" id="registerForm">


        <!-- NAME -->

        <label for="name">Name</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <!-- EMAIL -->

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
        >


        <!-- PASSWORD -->

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >


        <!-- CAMERA SECTION -->

        <div class="camera-section">

            <h3>Candidate Photo</h3>


            <!-- CAMERA -->

            <video
                id="camera"
                autoplay
                playsinline
            ></video>


            <!-- CAMERA BUTTONS -->

            <div class="camera-buttons">

                <button
                    type="button"
                    id="startCamera"
                >
                    Start Camera
                </button>


                <button
                    type="button"
                    id="capturePhoto"
                    disabled
                >
                    Capture Photo
                </button>

            </div>


            <!-- HIDDEN CANVAS -->

            <canvas id="canvas"></canvas>


            <!-- CAPTURED PHOTO PREVIEW -->

            <img
                id="preview"
                alt="Captured Photo"
            >


            <!-- PHOTO STATUS -->

            <p id="photoStatus"></p>

        </div>


        <!-- REGISTER BUTTON -->

        <button
            type="submit"
            id="registerButton"
            disabled
        >
            Register Candidate
        </button>


    </form>


</div>



<script>


    // ========================================
    // GET HTML ELEMENTS
    // ========================================

    const video =
        document.getElementById("camera");


    const canvas =
        document.getElementById("canvas");


    const preview =
        document.getElementById("preview");


    const startCameraButton =
        document.getElementById("startCamera");


    const captureButton =
        document.getElementById("capturePhoto");


    const registerButton =
        document.getElementById("registerButton");


    const photoStatus =
        document.getElementById("photoStatus");


    // Store camera stream

    let cameraStream = null;



    // ========================================
    // START CAMERA
    // ========================================

    startCameraButton.addEventListener(
        "click",
        async function () {

            try {

                // Request camera permission

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true
                    });


                // Display camera stream

                video.srcObject =
                    cameraStream;


                // Enable capture button

                captureButton.disabled =
                    false;


                photoStatus.textContent =
                    "Camera started. Position your face and click Capture Photo.";

            }

            catch (error) {

                console.error(error);

                photoStatus.textContent =
                    "Unable to access camera. Please allow camera permission.";

            }

        }
    );



    // ========================================
    // CAPTURE PHOTO
    // ========================================

    captureButton.addEventListener(
        "click",
        function () {


            // Set canvas dimensions

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            // Get canvas context

            const context =
                canvas.getContext("2d");


            // Copy current camera frame
            // into canvas

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Convert canvas to image

            const imageData =
                canvas.toDataURL("image/jpeg");


            // Display preview

            preview.src =
                imageData;

            preview.style.display =
                "block";


            photoStatus.textContent =
                "Photo captured. Saving...";



            // ========================================
            // CONVERT IMAGE TO BLOB
            // ========================================

            canvas.toBlob(
                async function (blob) {


                    // Create FormData

                    const formData =
                        new FormData();


                    // Add captured photo

                    formData.append(
                        "photo",
                        blob,
                        "candidate.jpg"
                    );



                    // ========================================
                    // SEND PHOTO TO FLASK
                    // ========================================

                    try {

                        const response =
                            await fetch(
                                "/capture-photo",
                                {
                                    method: "POST",
                                    body: formData
                                }
                            );


                        // Convert Flask response
                        // into JSON

                        const result =
                            await response.json();



                        // ========================================
                        // CHECK RESPONSE
                        // ========================================

                        if (result.success) {


                            photoStatus.textContent =
                                "✓ Photo captured successfully!";


                            // Enable registration

                            registerButton.disabled =
                                false;


                            // Stop camera

                            if (cameraStream) {

                                cameraStream
                                    .getTracks()
                                    .forEach(
                                        function(track) {

                                            track.stop();

                                        }
                                    );

                            }

                        }

                        else {

                            photoStatus.textContent =
                                "Photo capture failed.";

                        }

                    }

                    catch (error) {

                        console.error(error);

                        photoStatus.textContent =
                            "Unable to save photo.";

                    }


                },
                "image/jpeg"
            );

        }
    );


</script>


</body>

</html>
