<!DOCTYPE html>
<html>

<head>
    <title>ExamGuard Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f0e8;
            color: #26332d;
            text-align: center;
        }

        h1 {
            margin-top: 100px;
            color: #34483d;
        }

        p {
            color: #66756b;
            font-size: 16px;
        }

        .dashboard-box {
            width: 500px;
            margin: 30px auto;
            padding: 40px;
            background: #ffffff;
            border: 1px solid #d9ddd5;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(38, 51, 45, 0.08);
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 25px;
            background: #536b5d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #3f5548;
        }
    </style>

</head>

<body>

    <div class="dashboard-box">

        <h1>Candidate Dashboard</h1>

        <p>Welcome to ExamGuard!</p>

        <a href="/logout">Logout</a>

    </div>

</body>

</html>
